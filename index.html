<script type="text/python">
from browser import document, window, sys

# --- MASTER CODE LIST ---
MASTER_CODE = [
    "import time",
    "def slow_print(text):",
    "    print(text)",
    "slow_print('--- Welcome to Space Odyssey ---')",
    "choice1 = input('Investigate or Continue? ').lower()",
    "if choice1 == 'investigate':",
    "    print('You found a beacon!')",
    "elif choice1 == 'continue':",
    "    print('You pushed forward.')",
    "else:",
    "    print('Invalid choice.')"
]

state = {"index": 0, "typed": []}

# --- REDIRECT PRINT TO CONSOLE ---
def write(data):
    document["console"].text += str(data)

sys.stdout.write = write

# --- THE TAB KEY FIX ---
def on_keydown(ev):
    if ev.keyCode == 9:
        ev.preventDefault()
        target = ev.target
        start = target.selectionStart
        end = target.selectionEnd
        target.value = target.value[:start] + "    " + target.value[end:]
        target.selectionStart = target.selectionEnd = start + 4

document["user-input"].bind("keydown", on_keydown)

def update_ui():
    if state["index"] < len(MASTER_CODE):
        document["target-code"].text = MASTER_CODE[state["index"]]
        document["progress"].text = f"Line {state['index'] + 1} of {len(MASTER_CODE)}"
        document["user-input"].value = ""
    else:
        document["game-area"].style.display = "none"
        document["final-area"].style.display = "block"

def check_line(ev):
    user_val = document["user-input"].value
    target_val = MASTER_CODE[state["index"]]
    
    if user_val.rstrip() == target_val.rstrip():
        state["typed"].append(user_val)
        state["index"] += 1
        document["error-msg"].text = ""
        update_ui()
    else:
        document["error-msg"].text = "❌ Typo detected! Check your leading spaces (indentation)."

def run_code(ev):
    # Clear the console before running
    document["console"].text = ""
    full_code = "\n".join(state["typed"])
    try:
        # Run the code
        exec(full_code)
    except Exception as e:
        document["console"].text = f"Error: {e}"

document["submit-btn"].bind("click", check_line)
document["run-btn"].bind("click", run_code)
update_ui()
</script>
