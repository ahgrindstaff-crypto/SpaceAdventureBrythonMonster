<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: monospace; padding: 20px; }
        #app-container { max-width: 700px; margin: auto; background: #161b22; padding: 25px; border: 2px solid #30363d; border-radius: 8px; }
        
        /* THE TARGET TEXT - Simplified for visibility */
        #target-code { 
            background: #000; 
            color: #ffff00 !important; /* Bright Yellow for maximum contrast */
            padding: 20px; 
            font-size: 1.5em; 
            border: 1px solid #58a6ff;
            margin: 15px 0;
            display: block;
            min-height: 1.2em;
        }

        input { width: 100%; padding: 15px; font-size: 1.2em; background: #0d1117; color: white; border: 1px solid #58a6ff; box-sizing: border-box; }
        button { background: #238636; color: white; border: none; padding: 15px 30px; margin-top: 10px; cursor: pointer; font-size: 1em; border-radius: 4px; }
        #console { background: black; color: #79c0ff; padding: 15px; margin-top: 20px; border: 1px solid #30363d; min-height: 50px; }
        .error { color: #ff7b72; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body onload="brython()">
    <div id="app-container">
        <h1 style="color:#58a6ff;">🚀 STARSHIP NOVA OVERRIDE</h1>
        <p>Type the line below exactly as it appears:</p>
        
        <div id="target-code">import time</div>
        
        <input type="text" id="user-input" autocomplete="off" placeholder="Type here...">
        <div id="error-msg" class="error"></div>
        <button id="submit-btn">VALIDATE LINE</button>
        <p id="progress" style="color:#8b949e;">Line 1 of 12</p>

        <div id="final-area" style="display:none;">
            <h2 style="color:#2ea043;">✅ SYSTEMS READY</h2>
            <button id="run-btn">RUN PROGRAM</button>
            <div id="console"></div>
        </div>
    </div>

<script type="text/python">
from browser import document, sys

MASTER_CODE = [
    "import time",
    "def slow_print(text):",
    "    print(text)",
    "slow_print('--- Welcome to Space Odyssey ---')",
    "choice1 = input('Investigate or Continue? ').lower()",
    "if choice1 == 'investigate':",
    "    print('You found an ancient beacon!')",
    "elif choice1 == 'continue':",
    "    print('Moving toward the Gate.')",
    "else:",
    "    print('Invalid choice.')"
]

state = {"idx": 0, "lines": []}

def write(data):
    document["console"].text += str(data)
sys.stdout.write = write

def update_ui():
    if state["idx"] < len(MASTER_CODE):
        document["target-code"].text = MASTER_CODE[state["idx"]]
        document["progress"].text = f"Line {state['idx']+1} of {len(MASTER_CODE)}"
        document["user-input"].value = ""
        document["user-input"].focus()
    else:
        document["app-container"].innerHTML = "<h1>✅ Mission Complete!</h1><p>Copy your code for CodeHS:</p><pre style='background:#000;padding:20px;color:#0f0;'>" + "\\n".join(state["lines"]) + "</pre>"

def validate(ev):
    val = document["user-input"].value
    goal = MASTER_CODE[state["idx"]]
    if val.rstrip() == goal.rstrip():
        state["lines"].append(val)
        state["idx"] += 1
        document["error-msg"].text = ""
        update_ui()
    else:
        document["error-msg"].text = "❌ Check your spelling and indentation!"

def handle_keys(ev):
    if ev.keyCode == 9: # Tab
        ev.preventDefault()
        s = ev.target.selectionStart
        ev.target.value = ev.target.value[:s] + "    " + ev.target.value[s:]
        ev.target.selectionStart = ev.target.selectionEnd = s + 4
    if ev.keyCode == 13: # Enter
        validate(None)

document["user-input"].bind("keydown", handle_keys)
document["submit-btn"].bind("click", validate)

# Set the very first target on startup
update_ui()
</script>
</body>
</html>
